<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M1,1 L14,7 L1,13 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1020" height="640" fill="#ffffff"/>

  <!-- ===== Fronteira do sistema ===== -->
  <rect x="360" y="15" width="635" height="580" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="677" y="40" text-anchor="middle" font-size="13" font-weight="bold">Portfólio — Perfis de Acesso</text>

  <!-- ===== Ator pai: Visitante ===== -->
  <g stroke="#000000" stroke-width="1.6" fill="none">
    <circle cx="150" cy="42" r="9" fill="#ffffff"/>
    <line x1="150" y1="51" x2="150" y2="80"/>
    <line x1="135" y1="61" x2="165" y2="61"/>
    <line x1="150" y1="80" x2="137" y2="100"/>
    <line x1="150" y1="80" x2="163" y2="100"/>
  </g>
  <text x="150" y="116" text-anchor="middle" font-size="11.5" font-weight="bold">Visitante</text>

  <!-- ===== Generalização (filhos -> pai, seta triangular vazada) ===== -->
  <line x1="55" y1="196" x2="138" y2="124" stroke="#000000" stroke-width="1.2" marker-end="url(#tri)"/>
  <line x1="160" y1="196" x2="150" y2="126" stroke="#000000" stroke-width="1.2" marker-end="url(#tri)"/>
  <line x1="266" y1="196" x2="163" y2="124" stroke="#000000" stroke-width="1.2" marker-end="url(#tri)"/>

  <!-- ===== Atores filhos ===== -->
  <!-- Recrutador -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="55" cy="212" r="8" fill="#ffffff"/>
    <line x1="55" y1="220" x2="55" y2="246"/>
    <line x1="42" y1="229" x2="68" y2="229"/>
    <line x1="55" y1="246" x2="44" y2="264"/>
    <line x1="55" y1="246" x2="66" y2="264"/>
  </g>
  <text x="55" y="280" text-anchor="middle" font-size="10" font-weight="bold">Recrutador /</text>
  <text x="55" y="292" text-anchor="middle" font-size="10" font-weight="bold">Empresa</text>
  <text x="55" y="305" text-anchor="middle" font-size="7.8" fill="#333333">destaque: experiências,</text>
  <text x="55" y="315" text-anchor="middle" font-size="7.8" fill="#333333">habilidades e contato</text>

  <!-- Professor -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="160" cy="212" r="8" fill="#ffffff"/>
    <line x1="160" y1="220" x2="160" y2="246"/>
    <line x1="147" y1="229" x2="173" y2="229"/>
    <line x1="160" y1="246" x2="149" y2="264"/>
    <line x1="160" y1="246" x2="171" y2="264"/>
  </g>
  <text x="160" y="280" text-anchor="middle" font-size="10" font-weight="bold">Professor /</text>
  <text x="160" y="292" text-anchor="middle" font-size="10" font-weight="bold">Avaliador</text>
  <text x="160" y="305" text-anchor="middle" font-size="7.8" fill="#333333">destaque: formação e</text>
  <text x="160" y="315" text-anchor="middle" font-size="7.8" fill="#333333">projetos acadêmicos</text>

  <!-- Desenvolvedor -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="266" cy="212" r="8" fill="#ffffff"/>
    <line x1="266" y1="220" x2="266" y2="246"/>
    <line x1="253" y1="229" x2="279" y2="229"/>
    <line x1="266" y1="246" x2="255" y2="264"/>
    <line x1="266" y1="246" x2="277" y2="264"/>
  </g>
  <text x="266" y="280" text-anchor="middle" font-size="10" font-weight="bold">Desenvolvedor /</text>
  <text x="266" y="292" text-anchor="middle" font-size="10" font-weight="bold">Comunidade</text>
  <text x="266" y="305" text-anchor="middle" font-size="7.8" fill="#333333">destaque: stack e</text>
  <text x="266" y="315" text-anchor="middle" font-size="7.8" fill="#333333">código aberto</text>

  <!-- ===== Ator: Proprietário ===== -->
  <g stroke="#000000" stroke-width="1.6" fill="none">
    <circle cx="150" cy="505" r="9" fill="#ffffff"/>
    <line x1="150" y1="514" x2="150" y2="543"/>
    <line x1="135" y1="524" x2="165" y2="524"/>
    <line x1="150" y1="543" x2="137" y2="563"/>
    <line x1="150" y1="543" x2="163" y2="563"/>
  </g>
  <text x="150" y="579" text-anchor="middle" font-size="11" font-weight="bold">Proprietário (Lucas)</text>
  <text x="150" y="592" text-anchor="middle" font-size="8.2" fill="#333333">configura o que cada perfil destaca</text>

  <!-- ===== Casos de uso ===== -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.3">
    <ellipse cx="500" cy="80" rx="105" ry="28"/>
    <ellipse cx="490" cy="200" rx="100" ry="28"/>
    <ellipse cx="490" cy="320" rx="100" ry="28"/>
    <ellipse cx="505" cy="440" rx="110" ry="30"/>
    <ellipse cx="840" cy="200" rx="110" ry="32"/>
    <ellipse cx="840" cy="470" rx="110" ry="32"/>
  </g>
  <text x="500" y="76" text-anchor="middle" font-size="10" font-weight="bold">UC01</text>
  <text x="500" y="90" text-anchor="middle" font-size="10">Selecionar perfil de acesso</text>
  <text x="490" y="196" text-anchor="middle" font-size="10" font-weight="bold">UC02</text>
  <text x="490" y="210" text-anchor="middle" font-size="10">Pular seleção</text>
  <text x="490" y="316" text-anchor="middle" font-size="10" font-weight="bold">UC03</text>
  <text x="490" y="330" text-anchor="middle" font-size="10">Trocar perfil</text>
  <text x="505" y="428" text-anchor="middle" font-size="10" font-weight="bold">UC05</text>
  <text x="505" y="442" text-anchor="middle" font-size="10">Acessar por link com</text>
  <text x="505" y="455" text-anchor="middle" font-size="10">perfil pré-definido</text>
  <text x="840" y="188" text-anchor="middle" font-size="10" font-weight="bold">UC04</text>
  <text x="840" y="202" text-anchor="middle" font-size="10">Visualizar portfólio</text>
  <text x="840" y="215" text-anchor="middle" font-size="10">com destaques</text>
  <text x="840" y="458" text-anchor="middle" font-size="10" font-weight="bold">UC06</text>
  <text x="840" y="472" text-anchor="middle" font-size="10">Configurar destaques</text>
  <text x="840" y="485" text-anchor="middle" font-size="10">de um perfil</text>

  <!-- ===== Associações Visitante -> casos de uso (ortogonais) ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <polyline points="185,55 320,55 320,80 395,80"/>
    <polyline points="185,70 332,70 332,200 390,200"/>
    <polyline points="185,85 344,85 344,320 390,320"/>
    <polyline points="185,100 356,100 356,440 395,440"/>
  </g>

  <!-- ===== Associação Proprietário -> UC06 ===== -->
  <polyline points="185,530 840,530 840,502" fill="none" stroke="#000000" stroke-width="1.1"/>

  <!-- ===== include / extend ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4">
    <line x1="602" y1="92" x2="740" y2="178" marker-end="url(#open)"/>
    <line x1="592" y1="200" x2="726" y2="200" marker-end="url(#open)"/>
    <line x1="612" y1="428" x2="742" y2="224" marker-end="url(#open)"/>
    <polyline points="590,312 625,312 625,95 610,88" marker-end="url(#open)"/>
  </g>
  <text x="655" y="122" text-anchor="middle" font-size="9.5" font-style="italic">«include»</text>
  <text x="659" y="193" text-anchor="middle" font-size="9.5" font-style="italic">«include»</text>
  <text x="694" y="336" text-anchor="middle" font-size="9.5" font-style="italic">«include»</text>
  <text x="652" y="262" text-anchor="middle" font-size="9.5" font-style="italic">«extend»</text>
</svg>
